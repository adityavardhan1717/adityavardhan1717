<svg width="1020" height="240" viewBox="0 0 1020 240" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16213E"/>
      <stop offset="50%" stop-color="#1F3A5F"/>
      <stop offset="100%" stop-color="#2C5364"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4A6FA5" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#6FD8C7" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#F2B872" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="softVignette" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1020" height="240" rx="18" fill="url(#bgGrad)"/>
  <rect width="1020" height="240" rx="18" fill="url(#softVignette)"/>

  <!-- subtle dot texture -->
  <g opacity="0.08">
    <circle cx="60" cy="40" r="1.5" fill="#EDEDED"/>
    <circle cx="140" cy="70" r="1.5" fill="#EDEDED"/>
    <circle cx="900" cy="50" r="1.5" fill="#EDEDED"/>
    <circle cx="960" cy="90" r="1.5" fill="#EDEDED"/>
    <circle cx="500" cy="30" r="1.5" fill="#EDEDED"/>
    <circle cx="300" cy="200" r="1.5" fill="#EDEDED"/>
    <circle cx="750" cy="190" r="1.5" fill="#EDEDED"/>
  </g>

  <!-- timeline line -->
  <line x1="60" y1="135" x2="960" y2="135" stroke="url(#lineGrad)" stroke-width="2.5"/>

  <!-- Node 1: Wipro -->
  <g>
    <text x="102" y="100" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="15" fill="#EDEDED" text-anchor="middle" font-weight="600">Wipro</text>
    <circle cx="102" cy="135" r="7" fill="#4A6FA5"/>
    <circle cx="102" cy="135" r="7" fill="none" stroke="#4A6FA5" stroke-width="1.5" opacity="0.5"><animate attributeName="r" values="7;12;7" dur="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.5;0;0.5" dur="3s" repeatCount="indefinite"/></circle>
    <text x="102" y="163" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="11" fill="#9FB0C3" text-anchor="middle">2021 – 2022</text>
    <text x="102" y="182" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="11" fill="#6FD8C7" text-anchor="middle">Project Engineer</text>
  </g>

  <!-- Node 2: Muthoot -->
  <g>
    <text x="325" y="100" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="15" fill="#EDEDED" text-anchor="middle" font-weight="600">Muthoot Fincorp One</text>
    <circle cx="325" cy="135" r="7" fill="#4A6FA5"/>
    <circle cx="325" cy="135" r="7" fill="none" stroke="#4A6FA5" stroke-width="1.5" opacity="0.5"><animate attributeName="r" values="7;12;7" dur="3s" begin="0.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.5;0;0.5" dur="3s" begin="0.4s" repeatCount="indefinite"/></circle>
    <text x="325" y="163" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="11" fill="#9FB0C3" text-anchor="middle">2022 – 2024</text>
    <text x="325" y="182" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="11" fill="#6FD8C7" text-anchor="middle">SDE II · Kafka backbone</text>
  </g>

  <!-- Node 3: Freelance -->
  <g>
    <text x="555" y="100" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="15" fill="#EDEDED" text-anchor="middle" font-weight="600">Independent</text>
    <circle cx="555" cy="135" r="7" fill="#6FD8C7"/>
    <circle cx="555" cy="135" r="7" fill="none" stroke="#6FD8C7" stroke-width="1.5" opacity="0.5"><animate attributeName="r" values="7;13;7" dur="2.4s" begin="0.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.6;0;0.6" dur="2.4s" begin="0.8s" repeatCount="indefinite"/></circle>
    <text x="555" y="163" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="11" fill="#9FB0C3" text-anchor="middle">2024 – 2025</text>
    <text x="555" y="182" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="11" fill="#6FD8C7" text-anchor="middle">Freelance Backend Dev</text>
  </g>

  <!-- Node 4: TUS Limerick -->
  <g>
    <text x="775" y="100" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="15" fill="#EDEDED" text-anchor="middle" font-weight="600">TUS Limerick</text>
    <circle cx="775" cy="135" r="7" fill="#4A6FA5"/>
    <circle cx="775" cy="135" r="7" fill="none" stroke="#4A6FA5" stroke-width="1.5" opacity="0.5"><animate attributeName="r" values="7;12;7" dur="3s" begin="1.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.5;0;0.5" dur="3s" begin="1.2s" repeatCount="indefinite"/></circle>
    <text x="775" y="163" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="11" fill="#9FB0C3" text-anchor="middle">2025 – 2026</text>
    <text x="775" y="182" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="11" fill="#6FD8C7" text-anchor="middle">MSc Data Analytics</text>
  </g>

  <!-- Node 5: Now -->
  <g filter="url(#glow)">
    <text x="945" y="100" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="15" fill="#F2B872" text-anchor="middle" font-weight="700">Now</text>
    <circle cx="945" cy="135" r="8" fill="#F2B872">
      <animate attributeName="r" values="8;10;8" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="945" cy="135" r="8" fill="none" stroke="#F2B872" stroke-width="1.5" opacity="0.6">
      <animate attributeName="r" values="8;16;8" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0;0.6" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="945" y="163" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="11" fill="#9FB0C3" text-anchor="middle">2026</text>
    <text x="945" y="182" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="11" fill="#F2B872" text-anchor="middle" font-weight="600">Open to roles</text>
  </g>
</svg>
